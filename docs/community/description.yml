extension:
  name: pintail
  description: Lightweight geospatial indexing functions for DuckDB, including Geohash encoding, GEOMETRY decoding, bounding boxes, and neighbors.
  version: 0.1.0
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
    - tshelianthus

repo:
  github: tshelianthus/duckdb-pintail
  ref: ef5644d2450bcdf269482292e5ab78b7b24dccb3

docs:
  hello_world: |
    INSTALL pintail FROM community;
    LOAD pintail;

    SELECT st_geohash(31.2304, 121.4737, 6);

  extended_description: |
    Pintail provides focused Geohash utilities for DuckDB. The extension supports
    latitude/longitude encoding with optional precision, whole-geometry encoding
    from POINT, LINESTRING, POLYGON, MULTI* and GEOMETRYCOLLECTION XY extents,
    center-point and cell-polygon decoding, bounding-box decoding, a BOX2D-compatible
    bounding-box alias, and the eight neighboring cells. Decode geometry uses
    native Core GEOMETRY with EPSG:4326 coordinates. NULL inputs propagate and
    invalid coordinates, hashes, and precision values raise query errors.
